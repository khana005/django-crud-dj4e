{% extends "base_bootstrap.html" %}

{% block content %}
<h1>Delete Auto</h1>
<p>Are you sure you want to delete the auto: <strong>{{ object.nickname }}</strong>?</p>
<form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url 'autos:all' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
